[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "healthkit-report"
version = "0.1.1"
description = "Parse Apple Health exports, de-duplicate multi-device records, and generate health reports (DOCX / XLSX / HTML)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "healthkit-report contributors" }]
keywords = ["apple-health", "healthkit", "quantified-self", "wearables", "report", "data-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Utilities",
]
dependencies = [
    "python-docx>=1.1",
    "XlsxWriter>=3.0",
]

[project.optional-dependencies]
fast = ["lxml>=5.0"]
dev = ["pytest>=8", "ruff>=0.5", "build>=1.0"]

[project.urls]
Homepage = "https://github.com/little-fire9552/healthkit-report"
Issues = "https://github.com/little-fire9552/healthkit-report/issues"

[project.scripts]
healthkit-report = "healthkit_report.cli:main"
hkrep = "healthkit_report.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
healthkit_report = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py39"

# A pragmatic rule set: real errors, import order, and a few bug-prone patterns.
# Typing-modernisation rules (UP) are intentionally off: the package supports 3.9
# and keeps typing.* names so the code reads the same on every version.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
