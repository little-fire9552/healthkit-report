[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "healthkit-report"
version = "0.1.0"
description = "Parse Apple Health exports, de-duplicate multi-device records, and generate health reports (DOCX / XLSX / HTML)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "healthkit-report contributors" }]
keywords = ["apple-health", "healthkit", "quantified-self", "wearables", "report", "data-analysis"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Utilities",
]
dependencies = [
    "python-docx>=1.1",
    "XlsxWriter>=3.0",
]

[project.optional-dependencies]
fast = ["lxml>=5.0"]
dev = ["pytest>=8", "ruff>=0.5", "build>=1.0"]

[project.urls]
Homepage = "https://github.com/your-name/healthkit-report"
Issues = "https://github.com/your-name/healthkit-report/issues"

[project.scripts]
healthkit-report = "healthkit_report.cli:main"
hkrep = "healthkit_report.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
healthkit_report = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py39"

[tool.pytest.ini_options]
testpaths = ["tests"]
